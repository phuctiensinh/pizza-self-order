databases:
  - name: pizza-db
    databaseName: pizzadb
    plan: free
    region: singapore

services:
  - type: web
    name: pizza-self-order
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm install --prefix client --include=dev && npm run build --prefix client
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pizza-db
          property: connectionString
      - key: SEPAY_BANK
        sync: false
      - key: SEPAY_ACCOUNT
        sync: false
      - key: SEPAY_ACCOUNT_NAME
        sync: false
      - key: SEPAY_API_KEY
        sync: false
